<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>To-Do Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="header-brand">
        <img src="img/logo.png" alt="Logo" class="header-logo" />
        <h1 class="header-title">My To-Do Dashboard</h1>
      </div>
      <p class="header-subtitle">Stay organised, stay productive.</p>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content" id="main">

    <!-- Add task form -->
    <section class="add-task-section" aria-label="Add a new task">
      <h2 class="sr-only">Add Task</h2>
      <div class="add-task-card">
        <div class="input-row">
          <label for="task-title" class="sr-only">Task title</label>
          <input
            type="text"
            id="task-title"
            class="input-title"
            placeholder="What needs to be done?"
            aria-label="Task title"
            maxlength="200"
            autocomplete="off"
          />
          <button id="add-btn" class="btn btn-primary" aria-label="Add task">
            + Add
          </button>
        </div>
        <div class="input-row">
          <label for="task-desc" class="sr-only">Task description (optional)</label>
          <textarea
            id="task-desc"
            class="input-desc"
            placeholder="Optional description…"
            aria-label="Task description (optional)"
            rows="2"
            maxlength="500"
          ></textarea>
        </div>
      </div>
    </section>

    <!-- Controls bar -->
    <section class="controls-bar" aria-label="Task filters and summary">
      <!-- Task counter -->
      <p class="task-counter" id="task-counter" aria-live="polite">
        0 tasks remaining
      </p>

      <!-- Filter buttons -->
      <div class="filter-group" role="group" aria-label="Filter tasks by status">
        <button class="btn btn-filter active" data-filter="all" aria-pressed="true">All</button>
        <button class="btn btn-filter" data-filter="active" aria-pressed="false">Active</button>
        <button class="btn btn-filter" data-filter="completed" aria-pressed="false">Completed</button>
      </div>

      <!-- Clear completed -->
      <button id="clear-completed-btn" class="btn btn-danger" aria-label="Clear all completed tasks">
        Clear Completed
      </button>
    </section>

    <!-- Task list -->
    <section class="task-section" aria-label="Task list">
      <ul id="task-list" class="task-list" aria-label="Tasks" aria-live="polite"></ul>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state" role="status" aria-live="polite" hidden>
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M20 32h24M32 20v24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <p class="empty-title">No tasks here!</p>
        <p class="empty-hint">Add a task above to get started.</p>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo">
    <p>All data saved locally in your browser.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
